[package]
name = "quick-translate-vn"
version = "3.1.1"
edition = "2021"
authors = ["Trunguyen104"]
description = "Ultra-lightweight cross-platform system-wide instant text & screen OCR translator"
license = "MIT"
repository = "https://github.com/Trunguyen104/QuickTranslateVN"

[[bin]]
name = "QuickTranslateVN"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.53"
tray-icon = "0.21"
global-hotkey = "0.7"
arboard = { version = "3.6", default-features = false }
auto-launch = "0.6"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json", "gzip"] }
native-tls = "0.2"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
windows = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(not(windows))'.dependencies]
rdev = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
