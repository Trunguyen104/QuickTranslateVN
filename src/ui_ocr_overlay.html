<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.22);
    overflow: hidden;
    cursor: crosshair;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  .banner {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    color: #0f172a;
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 12.5px;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.16);
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .banner span.key {
    background: #eff6ff;
    color: #2563eb;
    border: 1px solid #bfdbfe;
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
  }
  .sel-box {
    position: fixed;
    border: 2px solid #2563eb;
    background: rgba(37, 99, 235, 0.12);
    border-radius: 3px;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <span>Kéo chuột khoanh vùng ảnh cần đọc chữ &amp; dịch</span>
    <span class="key">ESC để hủy</span>
  </div>
  <div class="sel-box" id="box"></div>

  <script>
    const send = (obj) => window.ipc && window.ipc.postMessage(JSON.stringify(obj));
    const box = document.getElementById("box");
    const banner = document.getElementById("banner");

    let dragging = false;
    let startX = 0;
    let startY = 0;

    window.__resetOverlay = function () {
      dragging = false;
      box.style.display = "none";
      banner.style.display = "flex";
    };

    window.addEventListener("mousedown", (e) => {
      if (e.button === 2) {
        e.preventDefault();
        send({ cmd: "ocr_cancel" });
        return;
      }
      if (e.button !== 0) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      box.style.left = `${startX}px`;
      box.style.top = `${startY}px`;
      box.style.width = "0px";
      box.style.height = "0px";
      box.style.display = "block";
      send({ cmd: "ocr_drag_start" });
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const x = Math.min(startX, e.clientX);
      const y = Math.min(startY, e.clientY);
      const w = Math.abs(e.clientX - startX);
      const h = Math.abs(e.clientY - startY);
      box.style.left = `${x}px`;
      box.style.top = `${y}px`;
      box.style.width = `${w}px`;
      box.style.height = `${h}px`;
    });

    window.addEventListener("mouseup", (e) => {
      if (!dragging || e.button !== 0) return;
      dragging = false;
      box.style.display = "none";
      send({ cmd: "ocr_drag_end" });
    });

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        send({ cmd: "ocr_cancel" });
      }
    });
  </script>
</body>
</html>
