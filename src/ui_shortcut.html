<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #0f172a;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    overflow: hidden;
  }
  .box {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .title {
    font-size: 13.5px;
    font-weight: 600;
    color: #0f172a;
  }
  .hint {
    font-size: 11.5px;
    color: #64748b;
  }
  .key-display {
    height: 40px;
    border-radius: 8px;
    background: #f8fafc;
    border: 1.5px dashed #93c5fd;
    color: #2563eb;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .key-display.active {
    background: #eff6ff;
    border-style: solid;
    border-color: #2563eb;
  }
  .row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 2px;
  }
  button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    color: #475569;
  }
  button:hover {
    background: #f8fafc;
  }
  button.primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #ffffff;
  }
  button.primary:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="title">Đặt phím tắt dịch nhanh</div>
    <div class="hint">Nhấn tổ hợp phím bạn muốn dùng (ví dụ: Alt + Q, Ctrl + Shift + T, F8):</div>
    <div id="display" class="key-display">Đang chờ nhấn phím...</div>
    <div class="row">
      <button type="button" id="btnCancel">Hủy</button>
      <button type="button" id="btnSave" class="primary">Lưu phím tắt</button>
    </div>
  </div>

  <script>
    const send = (obj) => window.ipc && window.ipc.postMessage(JSON.stringify(obj));
    const display = document.getElementById("display");
    let currentCombo = "";

    window.__setInitialShortcut = function (str) {
      currentCombo = str || "";
      display.textContent = currentCombo || "Đang chờ nhấn phím...";
      display.classList.toggle("active", Boolean(currentCombo));
    };

    function mapKeyName(e) {
      if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return null;
      const code = e.code || "";
      if (code.startsWith("Key")) return code.slice(3).toUpperCase();
      if (code.startsWith("Digit")) return code.slice(5);
      if (/^F([1-9]|1[0-2])$/.test(code)) return code;
      if (code === "Space") return "Space";
      if (code === "Backquote") return "`";
      return null;
    }

    window.addEventListener("keydown", (e) => {
      e.preventDefault();
      e.stopPropagation();

      if (e.key === "Escape") {
        send({ cmd: "shortcut_cancel" });
        return;
      }

      const mainKey = mapKeyName(e);
      if (!mainKey) return;

      const parts = [];
      if (e.ctrlKey) parts.push("Ctrl");
      if (e.altKey) parts.push("Alt");
      if (e.shiftKey) parts.push("Shift");
      if (e.metaKey) parts.push("Super");

      // Require at least one modifier unless user presses F1..F12
      if (parts.length === 0 && !mainKey.startsWith("F")) {
        display.textContent = "Hãy kết hợp cùng Ctrl, Alt hoặc Shift!";
        display.classList.remove("active");
        return;
      }

      parts.push(mainKey);
      currentCombo = parts.join("+");
      display.textContent = currentCombo.replaceAll("+", " + ");
      display.classList.add("active");
    });

    document.getElementById("btnSave").addEventListener("click", () => {
      if (currentCombo) {
        send({ cmd: "shortcut_save", shortcut: currentCombo });
      }
    });

    document.getElementById("btnCancel").addEventListener("click", () => {
      send({ cmd: "shortcut_cancel" });
    });
  </script>
</body>
</html>
