name: Build Cross-Platform Releases (Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: QuickTranslateVN-windows-x64.zip
          - os: macos-latest
            artifact_name: QuickTranslateVN-macos-arm64.tar.gz
          - os: ubuntu-22.04
            artifact_name: QuickTranslateVN-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build Native Release Binary
        run: cargo build --release

      - name: Package Windows ZIP Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package_win | Out-Null
          Copy-Item "target/release/QuickTranslateVN.exe" "package_win/QuickTranslateVN.exe"
          Copy-Item "README.md" "package_win/README.md"
          Copy-Item "LICENSE" "package_win/LICENSE"
          Compress-Archive -Path "package_win/*" -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Package Unix Tarball (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x target/release/QuickTranslateVN
          tar -czf ${{ matrix.artifact_name }} -C target/release QuickTranslateVN

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release_assets
        run: |
          sha256sum QuickTranslateVN-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/QuickTranslateVN-*
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### 📥 Tải về & Hướng dẫn mở nhanh
            - **Windows 10/11:** Tải `QuickTranslateVN-windows-x64.zip`, giải nén và mở `QuickTranslateVN.exe`.
              > *Lưu ý SmartScreen:* Vì đây là dự án mã nguồn mở miễn phí chưa gắn chứng chỉ thương mại trả phí, lần đầu mở nếu Windows hiện bảng xanh *"Windows protected your PC"*, hãy bấm **More info (Thông tin thêm)** → **Run anyway (Vẫn chạy)**. Bạn có thể đối chiếu mã băm an toàn trong `SHA256SUMS.txt`.
            - **macOS (Apple Silicon):** Tải `QuickTranslateVN-macos-arm64.tar.gz`, giải nén và chạy.
            - **Linux (x64):** Tải `QuickTranslateVN-linux-x64.tar.gz`, giải nén và chạy.

            ### ⌨️ Phím tắt mặc định (Có thể đổi tùy ý dưới System Tray)
            - **`Alt + S`** (`Option + S`): Khoanh vùng chụp màn hình → Đọc chữ từ ảnh bằng OCR có sẵn của hệ điều hành → Dịch ngay.
            - **`Alt + Q`** (`Option + Q`) / **`Ctrl + C + C`** / **Nút nổi `[文A]`**: Dịch nhanh văn bản đang bôi đen.
