name: Build Cross-Platform Releases (Windows, macOS, Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: QuickTranslateVN-windows-x64.exe
            asset_path: target/release/QuickTranslateVN.exe
          - os: macos-latest
            artifact_name: QuickTranslateVN-macos-arm64.tar.gz
            asset_path: QuickTranslateVN-macos-arm64.tar.gz
          - os: ubuntu-22.04
            artifact_name: QuickTranslateVN-linux-x64.tar.gz
            asset_path: QuickTranslateVN-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build Native Release Binary
        run: cargo build --release

      - name: Package Unix Tarball (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x target/release/QuickTranslateVN
          tar -czf ${{ matrix.artifact_name }} -C target/release QuickTranslateVN

      - name: Prepare Windows Binary Name
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/release/QuickTranslateVN.exe" "${{ matrix.artifact_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Upload Asset to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          generate_release_notes: true
