name: Build Windows Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore QuickTranslateVN.sln

      - name: Build & Publish Single-File Release
        run: dotnet publish QuickTranslateVN.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickTranslateVN-win-x64
          path: ./publish/QuickTranslateVN.exe
